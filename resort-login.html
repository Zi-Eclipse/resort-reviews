<!DOCTYPE html>
<html>
<head>
    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
    <title>Resort Login - ResortReviews Maldives</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue: #1877f2;
            --blue-light: #e8f1fd;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f7f6f3;
            --bg-secondary: #f0efe9;
            --card-bg: #ffffff;
            --red: #dc2626;
            --red-light: #fef2f2;
            --green: #16a34a;
            --green-light: #f0fdf4;
        }

        [data-theme="dark"] {
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --bg: #111827;
            --bg-secondary: #2b3648;
            --card-bg: #1f2937;
            --blue-light: #1e3a5f;
            --red-light: #450a0a;
            --green-light: #052e16;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-left { display: flex; align-items: center; }
        .navbar-right { display: flex; align-items: center; gap: 8px; }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }

        .brand-name { font-weight: 700; font-size: 1.1rem; color: var(--text); }

        .theme-btn {
            background: var(--bg-secondary);
            color: var(--text-muted);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .theme-btn:hover { background: var(--border); }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-back:hover { background: var(--border); }

        /* Page centering */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 56px);
            padding: 40px 20px;
        }

        /* Login card */
        .login-container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .icon {
            width: 64px;
            height: 64px;
            background: var(--blue-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.5rem;
            color: var(--blue);
        }

        .login-header h1 {
            color: var(--text);
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            background: #fef9c3;
            color: #854d0e;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 4px;
        }

        [data-theme="dark"] .badge { background: #422006; color: #fde68a; }

        /* Form */
        .login-form .form-group { margin-bottom: 18px; }

        .login-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text);
            font-size: 0.875rem;
        }

        .login-form input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s;
        }

        .login-form input::placeholder { color: var(--text-muted); }

        .login-form input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(24,119,242,0.1);
        }

        /* Password wrapper */
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 42px; }

        .toggle-password-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-password-btn:hover { color: var(--text); }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 11px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover { opacity: 0.9; }

        /* Forgot password */
        .forgot-password { text-align: right; margin-top: 8px; }

        .forgot-password a {
            color: var(--blue);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot-password a:hover { text-decoration: underline; }

        /* Request link */
        .request-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .request-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
        }

        .request-link a:hover { text-decoration: underline; }

        /* Error / Success */
        .error-message {
            background: var(--red-light);
            color: var(--red);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(220,38,38,0.2);
            font-size: 0.875rem;
        }

        .success-message {
            background: var(--green-light);
            color: var(--green);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(22,163,74,0.2);
            font-size: 0.875rem;
        }

        /* Demo credentials */
        .demo-credentials {
            margin-top: 20px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .demo-credentials p { margin-bottom: 4px; }

        .demo-credentials code {
            background: var(--border);
            padding: 1px 5px;
            border-radius: 4px;
            color: var(--blue);
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            border-radius: 16px 16px 0 0;
        }

        .modal-header h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .modal-close {
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover { background: var(--bg-secondary); color: var(--text); }

        .modal-content form { padding: 20px; }

        .modal-content .form-group { margin-bottom: 14px; }

        .modal-content label {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(24,119,242,0.1);
        }

        .modal-content textarea { resize: vertical; min-height: 80px; }

        .post-btn {
            width: 100%;
            padding: 11px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .post-btn:hover { opacity: 0.9; }

        /* Reset content padding */
        .reset-content { padding: 20px; }

        @media (max-width: 640px) {
            .login-container { padding: 28px 20px; }
            .brand-name { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <a href="index.html" class="nav-brand">
            <svg width="28" height="28" viewBox="0 0 32 32" style="flex-shrink:0;">
              <rect width="32" height="32" rx="8" fill="#1877f2"/>
              <circle cx="16" cy="11" r="4" fill="white"/>
              <path d="M10 24 Q16 18 22 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
              <path d="M7 24 Q16 14 25 24" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
            </svg>
            <span class="brand-name">ResortReviews</span>
        </a>
    </div>
    <div class="navbar-right">
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to site</a>
    </div>
</nav>

<div class="login-page">
<div class="login-container">
    <div class="login-header">
        <div class="icon">
            <i class="fas fa-building"></i>
        </div>
        <h1>Resort Portal</h1>
        <p>Verified resorts only • <span class="badge">VERIFIED</span></p>
    </div>
    
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>
    
    <form class="login-form" id="loginForm">

            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="resort@example.com" required autocomplete="username">

<div class="form-group">

        <div class="forgot-password">
            <a href="#" onclick="showForgotPassword()">Forgot password?</a>
        </div>
        
        <button type="submit" class="login-btn">

</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotPasswordModal" onclick="closeForgotPassword()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="fas fa-key"></i> Reset Password</h3>
            <i class="fas fa-times modal-close" onclick="closeForgotPassword()"></i>
        </div>
        
        <div class="reset-content" style="padding: 20px;">
            <p style="margin-bottom: 15px;">Enter your email address and we'll send you a link to reset your password.</p>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="resetEmail" placeholder="resort@example.com">
            </div>
            
            <button class="post-btn" onclick="sendResetLink()">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </div>
    </div>
</div>

<!-- Verification Request Modal -->
<div class="modal-overlay" id="requestModal" onclick="closeRequestModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3><i class="fas fa-check-circle"></i> Request Verification</h3>
            <i class="fas fa-times modal-close" onclick="closeRequestModal()"></i>
        </div>
        
        <form id="requestForm">
            <div class="form-group">
                <label>Resort Name</label>
                <input type="text" id="req_resort" placeholder="e.g., Baros Maldives" required>
            </div>
            
            <div class="form-group">
                <label>Contact Person</label>
                <input type="text" id="req_contact" placeholder="HR Manager / General Manager" required>
            </div>
            
            <div class="form-group">
                <label>Official Email</label>
                <input type="email" id="req_email" placeholder="gm@resort.com" required>
            </div>
            
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="req_phone" placeholder="+960 123 4567">
            </div>
            
            <div class="form-group">
                <label>Message (optional)</label>
                <textarea id="req_message" placeholder="Any additional information that might help us verify your resort..."></textarea>
            </div>
            
            <button type="submit" class="post-btn">
                <i class="fas fa-paper-plane"></i> Submit Verification Request
            </button>
        </form>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
    window.toggleTheme = function() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    };
    document.addEventListener('DOMContentLoaded', function() {
        const theme = localStorage.getItem('theme') || 'light';
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });

    const SUPABASE_URL = "https://yaqtahzosvsrvbzurhgn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcXRhaHpvc3ZzcnZienVyaGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODE3MzMsImV4cCI6MjA4Nzc1NzczM30.x1dxVDvFuwrAXiOuqv-T6LtEP2IRXZAeSKQjIZjvbwk";
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
// Login form submission
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    console.log('🔐 Login attempt - Email:', email);
    
    // Clear previous error
    document.getElementById('errorMessage').style.display = 'none';
    
    try {
        // Use Supabase Auth to sign in
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        
        if (authError) {
            console.error('❌ Auth error:', authError);
            throw authError;
        }
        
        console.log('✅ Auth successful:', authData);
        
        // Now get the resort profile linked to this auth user
        const { data: profile, error: profileError } = await supabaseClient
            .from('resort_profiles')
            .select('*')
            .eq('id', authData.user.id)
            .maybeSingle();
        
        // If no profile in new table, check the old resorts table
        if (!profile) {
            const { data: oldResort } = await supabaseClient
                .from('resorts')
                .select('*')
                .eq('auth_user_id', authData.user.id)
                .maybeSingle();
            
            if (oldResort) {
                // Migrate to new profile table
                const { error: insertError } = await supabaseClient
                    .from('resort_profiles')
                    .insert([{
                        id: authData.user.id,
                        name: oldResort.name,
                        slug: oldResort.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                        address: oldResort.address || '',
                        phone: oldResort.phone || '',
                        hours: oldResort.hours || 'Open 24 hours',
                        website: oldResort.website || '',
                        verified: oldResort.verified || false,
                        google_rating: oldResort.google_rating || '',
                        star_rating: oldResort.star_rating || ''
                    }]);
                
                if (insertError) throw insertError;
                
                // Use the old resort data for login
                localStorage.setItem('resort_id', oldResort.id);
                localStorage.setItem('resort_name', oldResort.name);
                localStorage.setItem('login_timestamp', new Date().getTime().toString());
                
                window.location.href = 'resort-dashboard.html';
                return;
            }
        } else {
            // Found profile in new table
            localStorage.setItem('resort_id', profile.id);
            localStorage.setItem('resort_name', profile.name);
            localStorage.setItem('login_timestamp', new Date().getTime().toString());
            
            window.location.href = 'resort-dashboard.html';
            return;
        }
        
        // If we get here, no resort found
        throw new Error('No resort profile found for this account');
        
    } catch (error) {
        console.error('❌ Login error:', error);
        document.getElementById('errorMessage').textContent = 'Invalid email or password.';
        document.getElementById('errorMessage').style.display = 'block';
    }
});
    
    // Request verification form
    function showRequestForm() {
        document.getElementById('requestModal').classList.add('active');
    }
    
    function closeRequestModal() {
        document.getElementById('requestModal').classList.remove('active');
    }
    
    document.getElementById('requestForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const resortName = document.getElementById('req_resort').value;
        const contactPerson = document.getElementById('req_contact').value;
        const contactEmail = document.getElementById('req_email').value;
        const phone = document.getElementById('req_phone').value;
        const message = document.getElementById('req_message').value;
        
        // First check if this resort exists in our database
        const { data: existingResort } = await supabaseClient
            .from('resorts')
            .select('name')
            .eq('name', resortName)
            .maybeSingle();
        
        if (!existingResort) {
            const confirmAdd = confirm(`⚠️ "${resortName}" is not in our database.\n\nWould you like to request it to be added? This will be reviewed by our team.`);
            if (!confirmAdd) {
                return;
            }
        }
        
        const request = {
            resort_name: resortName,
            contact_person: contactPerson,
            contact_email: contactEmail,
            phone: phone,
            message: message,
            status: 'pending'
        };
        
        const { error } = await supabaseClient
            .from('verification_requests')
            .insert([request]);
        
        if (error) {
            alert('Error submitting request: ' + error.message);
        } else {
            alert('✅ Request submitted! We\'ll contact you within 24-48 hours.');
            closeRequestModal();
            document.getElementById('requestForm').reset();
            
            document.getElementById('successMessage').textContent = 'Request submitted successfully!';
            document.getElementById('successMessage').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        }
    });
    
    // Forgot password functions
    function showForgotPassword() {
        document.getElementById('forgotPasswordModal').classList.add('active');
    }
    
    function closeForgotPassword() {
        document.getElementById('forgotPasswordModal').classList.remove('active');
    }
    
    async function sendResetLink() {
        const email = document.getElementById('resetEmail').value;
        if (!email) {
            alert('Please enter your email');
            return;
        }

        const { data: resort } = await supabaseClient
            .from('resorts')
            .select('id, name')
            .eq('login_email', email)
            .maybeSingle();

        if (!resort) {
            alert('No account found with this email');
            return;
        }

        try {
            // Generate a new temporary password
            const tempPassword = Array.from(crypto.getRandomValues(new Uint8Array(12)))
                .map(b => 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b % 62])
                .join('');

            // Update the auth user's password via server endpoint
            const authRes = await fetch('https://www.resortreviews.pro/api/create-resort-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Reset-Password': 'true' },
                body: JSON.stringify({
                    email: email,
                    password: tempPassword,
                    resortName: resort.name
                })
            });

            if (!authRes.ok) {
                const errData = await authRes.json().catch(() => ({}));
                throw new Error(errData.error || 'Failed to reset password');
            }

            // Send the new password via email
            const emailRes = await fetch('https://www.resortreviews.pro/api/send-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Reset-Password': 'true' },
                body: JSON.stringify({
                    to: email,
                    subject: 'ResortReviews - Password Reset',
                    html: `
                        <div style="font-family: -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px;">
                            <h2 style="color: #111827;">Password Reset</h2>
                            <p>Hi <strong>${resort.name}</strong>,</p>
                            <p>Your password has been reset. Here are your new login credentials:</p>
                            <div style="background: #f7f6f3; border-radius: 8px; padding: 16px; margin: 20px 0;">
                                <p style="margin: 0;"><strong>Email:</strong> ${email}</p>
                                <p style="margin: 8px 0 0;"><strong>New Password:</strong> ${tempPassword}</p>
                            </div>
                            <p>Please log in and change your password in Settings.</p>
                            <p style="color: #6b7280; font-size: 13px;">— ResortReviews</p>
                        </div>
                    `
                })
            });

            if (!emailRes.ok) {
                alert('Password was reset but email failed to send.\n\nNew password: ' + tempPassword + '\n\nPlease save this now.');
            } else {
                alert('✅ New password sent to ' + email + '.\nCheck your inbox.');
            }

            closeForgotPassword();

        } catch (error) {
            alert('Error resetting password: ' + error.message);
        }
    }
// ===========================================
// TOGGLE PASSWORD VISIBILITY
// ===========================================
const togglePassword = document.getElementById('togglePassword');
const password = document.getElementById('password');
const toggleIcon = document.getElementById('togglePasswordIcon');

if (togglePassword && password) {
    togglePassword.addEventListener('click', function() {
        // Toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // Toggle the icon
        toggleIcon.classList.toggle('fa-eye');
        toggleIcon.classList.toggle('fa-eye-slash');
    });
}
</script>
